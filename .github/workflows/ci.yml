name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install media runtime and fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: npm test
      - run: npm run build
      - run: npm run test:media
        env:
          ASKEDITS_MEDIA_DEBUG: "1"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - name: Save browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-browser-checks
          path: output/browser/
